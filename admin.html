<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Biel Pizzaria</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:      #C0392B;
      --red-dark: #922B21;
      --orange:   #E67E22;
      --gold:     #F39C12;
      --green:    #27AE60;
      --blue:     #2980B9;
      --bg:       #F4F6F8;
      --card:     #FFFFFF;
      --text:     #2C3E50;
      --muted:    #7F8C8D;
      --border:   #E0E6EE;
      --shadow:   0 2px 12px rgba(0,0,0,.09);
      --radius:   12px;
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login ────────────────────────────────────────────── */
    #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, var(--red-dark), var(--red)); }
    .login-box { background: #fff; border-radius: 20px; padding: 40px 36px; max-width: 380px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25); text-align: center; }
    .login-box .lock { font-size: 3.5rem; margin-bottom: 12px; }
    .login-box h2 { font-size: 1.5rem; margin-bottom: 6px; }
    .login-box p  { color: var(--muted); font-size: .9rem; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 13px 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; margin-bottom: 14px; letter-spacing: 2px; }
    .login-box input:focus { outline: none; border-color: var(--red); }
    .btn-login { width: 100%; background: var(--red); color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
    .btn-login:hover { background: var(--red-dark); }
    .login-hint { margin-top: 14px; font-size: .82rem; color: var(--muted); }
    #loginErr { color: var(--red); font-size: .88rem; margin-top: 8px; min-height: 20px; }

    /* ── App shell ────────────────────────────────────────── */
    #appShell { display: none; min-height: 100vh; flex-direction: column; }

    header { background: linear-gradient(135deg, var(--red-dark), var(--red)); color: #fff; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 15px rgba(0,0,0,.25); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 1.2rem; font-weight: 800; }
    .logo span { color: var(--gold); }
    .nav-tabs { display: flex; gap: 4px; }
    .tab-btn { background: rgba(255,255,255,.15); color: #fff; border: none; padding: 7px 16px; border-radius: 50px; cursor: pointer; font-size: .88rem; font-weight: 500; transition: all .2s; white-space: nowrap; }
    .tab-btn:hover, .tab-btn.active { background: #fff; color: var(--red); font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .site-link { color: rgba(255,255,255,.8); font-size: .85rem; text-decoration: none; }
    .site-link:hover { color: #fff; }
    .logout-btn { background: rgba(255,255,255,.15); color: #fff; border: none; padding: 7px 14px; border-radius: 50px; cursor: pointer; font-size: .85rem; transition: background .2s; }
    .logout-btn:hover { background: rgba(255,255,255,.30); }

    /* ── New order badge ──────────────────────────────────── */
    .new-badge { background: var(--gold); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; margin-left: 6px; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

    /* ── Content ──────────────────────────────────────────── */
    .content { max-width: 1100px; margin: 0 auto; padding: 24px 20px; flex: 1; }

    /* ── Cards ────────────────────────────────────────────── */
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 22px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .card-header h3 { font-size: 1.1rem; font-weight: 700; }

    /* ── Stats ────────────────────────────────────────────── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat-card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); text-align: center; }
    .stat-card .value { font-size: 1.9rem; font-weight: 800; }
    .stat-card .label { font-size: .82rem; color: var(--muted); margin-top: 3px; }
    .stat-red    .value { color: var(--red); }
    .stat-orange .value { color: var(--orange); }
    .stat-green  .value { color: var(--green); }
    .stat-blue   .value { color: var(--blue); }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn { padding: 9px 18px; border-radius: 9px; border: none; font-size: .9rem; font-weight: 700; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-red   { background: var(--red);    color: #fff; } .btn-red:hover   { background: var(--red-dark); }
    .btn-green { background: var(--green);  color: #fff; } .btn-green:hover { background: #1E8449; }
    .btn-blue  { background: var(--blue);   color: #fff; } .btn-blue:hover  { background: #1A6FA0; }
    .btn-grey  { background: var(--border); color: var(--text); } .btn-grey:hover { background: #CDD4DC; }
    .btn-sm    { padding: 6px 12px; font-size: .82rem; border-radius: 7px; }
    .btn-icon  { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 5px; border-radius: 6px; transition: background .15s; }
    .btn-icon:hover { background: var(--border); }

    /* ── Filters ──────────────────────────────────────────── */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-btn { padding: 6px 14px; border-radius: 50px; border: 2px solid var(--border); background: var(--bg); cursor: pointer; font-size: .85rem; font-weight: 500; transition: all .2s; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--red); background: #FFF0EE; color: var(--red); font-weight: 700; }

    /* ── Orders ───────────────────────────────────────────── */
    .orders-list { display: flex; flex-direction: column; gap: 10px; }
    .order-card { border: 2px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .2s; }
    .order-card:hover { border-color: #C0C8D4; }
    .order-card.is-new { border-color: var(--blue); animation: highlight .6s ease; }
    @keyframes highlight { from { background: #EBF5FF; } to { background: transparent; } }
    .order-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: #FAFBFC; flex-wrap: wrap; gap: 10px; }
    .order-head-left { display: flex; align-items: center; gap: 12px; }
    .order-num  { font-weight: 800; font-size: 1rem; color: var(--red); }
    .order-meta { font-size: .82rem; color: var(--muted); }
    .badge { padding: 4px 12px; border-radius: 50px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
    .badge-novo       { background: #EBF5FF; color: var(--blue); }
    .badge-preparando { background: #FFF3E0; color: var(--orange); }
    .badge-pronto     { background: #E8F5E9; color: var(--green); }
    .badge-entregue   { background: #F5F5F5; color: var(--muted); }
    .badge-cancelado  { background: #FFEBEE; color: var(--red); }
    .order-body { padding: 13px 16px; border-top: 1px solid var(--border); }
    .order-items-row { font-size: .88rem; color: var(--muted); margin-bottom: 8px; }
    .order-detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; margin-bottom: 12px; }
    .order-detail-item { font-size: .83rem; }
    .order-detail-item .dk { color: var(--muted); }
    .order-detail-item .dv { font-weight: 600; }
    .order-actions { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .order-total { font-size: 1rem; font-weight: 800; color: var(--red); margin-left: auto; }
    .no-orders { text-align: center; padding: 50px; color: var(--muted); }
    .no-orders .ei { font-size: 3rem; margin-bottom: 10px; }

    /* ── Products ─────────────────────────────────────────── */
    .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px; }
    .prod-card { border: 2px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .2s; }
    .prod-card:hover { border-color: #C0C8D4; }
    .prod-card.unavailable { opacity: .65; }
    .prod-img { background: linear-gradient(135deg, #FFF0E6, #FFE4D6); height: 85px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; }
    .prod-info { padding: 12px; }
    .prod-cat   { font-size: .72rem; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .5px; }
    .prod-name  { font-weight: 700; font-size: .93rem; margin-bottom: 3px; }
    .prod-desc  { font-size: .78rem; color: var(--muted); margin-bottom: 8px; line-height: 1.35; }
    .prod-price { font-weight: 800; color: var(--red); margin-bottom: 10px; }
    .prod-foot  { display: flex; justify-content: space-between; align-items: center; }
    .avail-toggle { background: none; border: 2px solid var(--border); border-radius: 50px; padding: 4px 12px; font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .2s; }
    .avail-toggle.on  { border-color: var(--green); color: var(--green); }
    .avail-toggle.off { border-color: var(--red);   color: var(--red);   }
    .prod-acts { display: flex; gap: 4px; }

    /* ── Modal ────────────────────────────────────────────── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .3s; }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal { background: #fff; border-radius: 18px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.28); transform: scale(.92); transition: transform .3s; }
    .modal-overlay.show .modal { transform: scale(1); }
    .modal-head { background: linear-gradient(135deg, var(--red-dark), var(--red)); color: #fff; padding: 17px 20px; border-radius: 18px 18px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .modal-head h3 { font-size: 1.1rem; }
    .close-btn { background: rgba(255,255,255,.2); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: rgba(255,255,255,.35); }
    .modal-body { padding: 22px; }
    .fg { margin-bottom: 15px; }
    .fg label { display: block; font-weight: 600; margin-bottom: 5px; font-size: .88rem; }
    .fg input, .fg select, .fg textarea { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 9px; font-size: .93rem; font-family: inherit; transition: border-color .2s; }
    .fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: var(--red); }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; gap: 10px; margin-top: 18px; }
    .form-actions .btn { flex: 1; }

    /* ── Confirm ──────────────────────────────────────────── */
    .confirm-box { background: #fff; border-radius: var(--radius); padding: 28px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
    .confirm-box .icon { font-size: 3rem; margin-bottom: 10px; }
    .confirm-box h3    { margin-bottom: 8px; }
    .confirm-box p     { color: var(--muted); margin-bottom: 20px; font-size: .9rem; }
    .confirm-box .acts { display: flex; gap: 10px; }
    .confirm-box .acts .btn { flex: 1; }

    /* ── Toast ────────────────────────────────────────────── */
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #2C3E50; color: #fff; padding: 11px 22px; border-radius: 50px; font-weight: 600; z-index: 9999; transition: transform .3s; box-shadow: 0 5px 20px rgba(0,0,0,.3); white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .nav-tabs { display: none; }
      .prod-grid { grid-template-columns: 1fr; }
      .frow      { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ───────────────────────────────────────────────── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="lock">🔐</div>
    <h2>Painel Admin</h2>
    <p>Biel Pizzaria &amp; Churrascaria</p>
    <input type="password" id="pwdInput" placeholder="Senha de acesso">
    <button class="btn-login" onclick="tryLogin()">Entrar →</button>
    <div id="loginErr"></div>
    <p class="login-hint">Senha padrão: <strong>biel2024</strong></p>
  </div>
</div>

<!-- ── APP ─────────────────────────────────────────────────── -->
<div id="appShell">
  <header>
    <div class="header-left">
      <div class="logo">🍕 <span>Biel</span> Admin</div>
      <div class="nav-tabs">
        <button class="tab-btn active" id="tabBtnOrders"   onclick="showTab('orders')">📋 Pedidos</button>
        <button class="tab-btn"        id="tabBtnProducts" onclick="showTab('products')">🍽️ Cardápio</button>
        <button class="tab-btn"        id="tabBtnSettings" onclick="showTab('settings')">⚙️ Config</button>
      </div>
    </div>
    <div class="header-right">
      <a href="index.html" class="site-link">🌐 Ver site</a>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="content">
    <!-- ORDERS -->
    <div id="tab-orders">
      <div class="stats" id="statsBar"></div>
      <div class="card">
        <div class="card-header">
          <h3>📋 Pedidos <span id="newOrdersBadge" style="display:none" class="new-badge">!</span></h3>
          <span style="font-size:.82rem;color:var(--muted)">Atualização em tempo real 🔴</span>
        </div>
        <div class="filters" id="ordersFilters"></div>
        <div class="orders-list" id="ordersList">
          <div class="no-orders"><div class="ei">⏳</div><p>Carregando pedidos...</p></div>
        </div>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div id="tab-products" style="display:none">
      <div class="card">
        <div class="card-header">
          <h3>🍽️ Cardápio</h3>
          <button class="btn btn-green" onclick="openProdModal()">＋ Novo produto</button>
        </div>
        <div class="filters" id="prodCatFilter"></div>
        <div class="prod-grid" id="prodGrid">
          <p style="color:var(--muted);padding:20px">Carregando...</p>
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div id="tab-settings" style="display:none">
      <div class="card" style="max-width:500px">
        <div class="card-header"><h3>⚙️ Configurações</h3></div>
        <div class="fg"><label>Chave PIX</label><input id="setPix" type="text" placeholder="Número, e-mail ou CNPJ"></div>
        <div class="fg"><label>Taxa de entrega (R$)</label><input id="setFee" type="number" step="0.50" value="5"></div>
        <div class="fg"><label>Endereço do restaurante</label><input id="setAddr" type="text" placeholder="Rua, número — Bairro"></div>
        <div class="fg"><label>WhatsApp para atendimento</label><input id="setWhatsapp" type="text" placeholder="Ex: 5511999999999 (com código do país)"></div>
        <hr style="margin:18px 0;border-color:var(--border)">
        <div class="fg"><label>Nova senha de admin</label><input id="setNewPwd" type="password" placeholder="Deixe em branco para não alterar"></div>
        <div class="fg"><label>Confirmar nova senha</label><input id="setConfPwd" type="password" placeholder="Repita a nova senha"></div>
        <button class="btn btn-red" onclick="saveSettings()">💾 Salvar configurações</button>
      </div>
    </div>
  </div>
</div>

<!-- ── PRODUCT MODAL ────────────────────────────────────────── -->
<div class="modal-overlay" id="prodModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="prodModalTitle">Novo Produto</h3>
      <button class="close-btn" onclick="closeProdModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="prodDocId">
      <div class="fg"><label>Nome *</label><input id="prodName" type="text" placeholder="Nome do produto"></div>
      <div class="frow">
        <div class="fg"><label>Categoria *</label>
          <select id="prodCat">
            <option value="pizzas">🍕 Pizzas</option>
            <option value="churrasco">🥩 Churrasco</option>
            <option value="bebidas">🥤 Bebidas</option>
            <option value="combos">🎁 Combos</option>
            <option value="sobremesas">🍮 Sobremesas</option>
          </select>
        </div>
        <div class="fg"><label>Preço (R$) *</label><input id="prodPrice" type="number" step="0.50" min="0" placeholder="0,00"></div>
      </div>
      <div class="fg"><label>Descrição</label><textarea id="prodDesc" rows="2" placeholder="Ingredientes, tamanho, etc."></textarea></div>
      <div class="fg"><label>Emoji</label><input id="prodEmoji" type="text" placeholder="🍕" maxlength="4"></div>
      <div class="fg" style="display:flex;align-items:center;gap:10px">
        <input type="checkbox" id="prodAvail" checked style="width:18px;height:18px;accent-color:var(--red)">
        <label for="prodAvail" style="margin:0;cursor:pointer">Disponível no cardápio</label>
      </div>
      <div class="form-actions">
        <button class="btn btn-grey" onclick="closeProdModal()">Cancelar</button>
        <button class="btn btn-green" onclick="saveProd()">💾 Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- ── CONFIRM DIALOG ───────────────────────────────────────── -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="icon" id="confirmIcon">⚠️</div>
    <h3 id="confirmTitle">Confirmar?</h3>
    <p id="confirmMsg"></p>
    <div class="acts">
      <button class="btn btn-grey" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-red"  id="confirmOkBtn">Confirmar</button>
    </div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
/* =====================================================
   FIREBASE
   ===================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBxT4molkrOCsarG_cZyKPJE4dhLxNnTE4",
  authDomain: "biel-lanches-3815c.firebaseapp.com",
  projectId: "biel-lanches-3815c",
  storageBucket: "biel-lanches-3815c.firebasestorage.app",
  messagingSenderId: "778068239703",
  appId: "1:778068239703:web:cd13a046d2ba336f400a12"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =====================================================
   AUTH (senha salva no localStorage)
   ===================================================== */
function getPassword() { return localStorage.getItem('biel_admin_pwd') || 'biel2024'; }
function setPassword(v){ localStorage.setItem('biel_admin_pwd', v); }

function tryLogin() {
  const val = document.getElementById('pwdInput').value;
  if (val === getPassword()) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'flex';
    initApp();
  } else {
    document.getElementById('loginErr').textContent = '❌ Senha incorreta.';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

function logout() {
  if (unsubOrders) { unsubOrders(); unsubOrders = null; }
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pwdInput').value = '';
  document.getElementById('loginErr').textContent = '';
}

document.getElementById('pwdInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

/* =====================================================
   TABS
   ===================================================== */
let currentTab = 'orders';

function showTab(tab) {
  currentTab = tab;
  ['orders','products','settings'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tabBtn' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (btn) btn.classList.add('active');
  if (tab === 'products') loadAndRenderProducts();
  if (tab === 'settings') loadSettings();
}

/* =====================================================
   ORDERS — real-time listener
   ===================================================== */
const STATUS = {
  novo:       { label:'🔵 Novo',       badge:'badge-novo'       },
  preparando: { label:'🟠 Preparando', badge:'badge-preparando' },
  pronto:     { label:'🟢 Pronto',     badge:'badge-pronto'     },
  entregue:   { label:'✅ Entregue',   badge:'badge-entregue'   },
  cancelado:  { label:'❌ Cancelado',  badge:'badge-cancelado'  },
};
const NEXT = {
  novo:       [['preparando','🟠 Preparar'],['cancelado','❌ Cancelar']],
  preparando: [['pronto','🟢 Pronto'],     ['cancelado','❌ Cancelar']],
  pronto:     [['entregue','✅ Entregue'], ['cancelado','❌ Cancelar']],
  entregue:   [],
  cancelado:  [],
};

let allOrders    = [];
let orderFilter  = 'all';
let unsubOrders  = null;
let isFirstLoad  = true;
let newOrdersIds = new Set();

function startOrdersListener() {
  unsubOrders = db.collection('pedidos')
    .orderBy('date', 'desc')
    .onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'added' && !isFirstLoad) {
          newOrdersIds.add(ch.doc.id);
          playBeep();
          toast('🔔 Novo pedido chegou! #' + (ch.doc.data().num || ''));
          showNewBadge();
        }
      });
      isFirstLoad = false;
      allOrders = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
      renderStats();
      renderOrderFilters();
      renderOrderList();
    }, err => {
      console.error('Listener error:', err);
      toast('⚠️ Erro de conexão com o banco de dados.');
    });
}

function renderStats() {
  const today        = new Date().toDateString();
  const todayOrders  = allOrders.filter(o => o.date?.toDate && new Date(o.date.toDate()).toDateString() === today);
  const revenue      = todayOrders.filter(o => o.status !== 'cancelado').reduce((s, o) => s + (o.total || 0), 0);
  const active       = allOrders.filter(o => ['novo','preparando'].includes(o.status)).length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card stat-red">   <div class="value">${allOrders.length}</div><div class="label">Total de Pedidos</div></div>
    <div class="stat-card stat-orange"><div class="value">${active}</div><div class="label">Pedidos Ativos</div></div>
    <div class="stat-card stat-green"> <div class="value">R$ ${fmt(revenue)}</div><div class="label">Faturamento Hoje</div></div>
    <div class="stat-card stat-blue">  <div class="value">${todayOrders.length}</div><div class="label">Pedidos Hoje</div></div>`;
}

function renderOrderFilters() {
  const counts = {};
  allOrders.forEach(o => { counts[o.status] = (counts[o.status] || 0) + 1; });
  const filters = [
    { id:'all',        label:`Todos (${allOrders.length})` },
    { id:'novo',       label:`🔵 Novos (${counts.novo||0})` },
    { id:'preparando', label:`🟠 Preparando (${counts.preparando||0})` },
    { id:'pronto',     label:`🟢 Prontos (${counts.pronto||0})` },
    { id:'entregue',   label:`✅ Entregues (${counts.entregue||0})` },
    { id:'cancelado',  label:`❌ Cancelados (${counts.cancelado||0})` },
  ];
  document.getElementById('ordersFilters').innerHTML = filters.map(f =>
    `<button class="filter-btn${orderFilter===f.id?' active':''}" onclick="setOrderFilter('${f.id}')">${f.label}</button>`
  ).join('');
}

function setOrderFilter(f) { orderFilter = f; renderOrderFilters(); renderOrderList(); }

function renderOrderList() {
  const shown = orderFilter === 'all' ? allOrders : allOrders.filter(o => o.status === orderFilter);
  const el    = document.getElementById('ordersList');
  if (!shown.length) {
    el.innerHTML = `<div class="no-orders"><div class="ei">📋</div><p>Nenhum pedido encontrado</p></div>`;
    return;
  }
  el.innerHTML = shown.map(o => {
    const s   = STATUS[o.status] || STATUS.novo;
    const dt  = o.date?.toDate ? o.date.toDate() : new Date();
    const time = dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    const date = dt.toLocaleDateString('pt-BR');
    const PAY  = { pix:'PIX', cartao:'Cartão', dinheiro:'Dinheiro' };
    const DEL  = { entrega:'🛵 Entrega', retirada:'🏪 Retirada' };
    const actions = (NEXT[o.status] || []).map(([ns, label]) =>
      `<button class="btn btn-sm ${ns==='cancelado'?'btn-grey':'btn-blue'}"
        onclick="updateStatus('${o.docId}','${ns}')">${label}</button>`
    ).join('');
    const isNew = newOrdersIds.has(o.docId) ? ' is-new' : '';

    return `
      <div class="order-card${isNew}" id="oc-${o.docId}">
        <div class="order-head">
          <div class="order-head-left">
            <span class="order-num">#${o.num || '—'}</span>
            <div class="order-meta">${date} às ${time}</div>
          </div>
          <span class="badge ${s.badge}">${s.label}</span>
        </div>
        <div class="order-body">
          <div class="order-items-row">${(o.items||[]).map(i=>`${i.qty}× ${i.name}`).join(' · ')}</div>
          <div class="order-detail-grid">
            <div class="order-detail-item"><span class="dk">Cliente:</span> <span class="dv">${esc(o.customer?.name||'')}</span></div>
            <div class="order-detail-item"><span class="dk">Tel:</span> <span class="dv">${esc(o.customer?.phone||'')}</span></div>
            <div class="order-detail-item"><span class="dk">Entrega:</span> <span class="dv">${DEL[o.delivery]||o.delivery||'—'}</span></div>
            <div class="order-detail-item"><span class="dk">Pgto:</span> <span class="dv">${PAY[o.payment]||o.payment||'—'}</span></div>
            ${o.address ? `<div class="order-detail-item" style="grid-column:1/-1">
              <span class="dk">Endereço:</span>
              <span class="dv">${esc(o.address.rua)}, ${esc(o.address.num)}${o.address.comp?', '+esc(o.address.comp):''} — ${esc(o.address.bairro)} (CEP: ${esc(o.address.cep)})</span>
            </div>` : ''}
            ${o.obs ? `<div class="order-detail-item" style="grid-column:1/-1"><span class="dk">Obs:</span> <span class="dv">${esc(o.obs)}</span></div>` : ''}
          </div>
          <div class="order-actions">
            ${actions}
            <button class="btn btn-sm btn-grey" onclick="confirmDeleteOrder('${o.docId}','${o.num||''}')">🗑️</button>
            <span class="order-total">R$ ${fmt(o.total||0)}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function updateStatus(docId, newStatus) {
  try {
    await db.collection('pedidos').doc(docId).update({ status: newStatus });
    newOrdersIds.delete(docId);
    updateNewBadge();
    toast('Status atualizado!');
  } catch (e) { toast('Erro ao atualizar status.'); }
}

function confirmDeleteOrder(docId, num) {
  showConfirm('🗑️', 'Excluir pedido?', `O pedido #${num} será removido permanentemente.`, async () => {
    await db.collection('pedidos').doc(docId).delete();
    toast('Pedido excluído.');
  });
}

function showNewBadge() {
  const badge = document.getElementById('newOrdersBadge');
  badge.style.display = 'inline-flex';
  badge.textContent   = newOrdersIds.size;
}
function updateNewBadge() {
  const badge = document.getElementById('newOrdersBadge');
  if (newOrdersIds.size === 0) { badge.style.display = 'none'; }
  else { badge.textContent = newOrdersIds.size; }
}

/* =====================================================
   PRODUCTS
   ===================================================== */
const CATS_MAP = {
  pizzas:'🍕 Pizzas', churrasco:'🥩 Churrasco', bebidas:'🥤 Bebidas',
  combos:'🎁 Combos', sobremesas:'🍮 Sobremesas'
};

let allProducts   = [];
let prodCatFilter = 'all';

async function loadAndRenderProducts() {
  try {
    const snap = await db.collection('produtos').orderBy('id').get();
    allProducts = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
  } catch (e) { toast('Erro ao carregar produtos.'); }
  renderProdCatFilter();
  renderProdGrid();
}

function renderProdCatFilter() {
  const btns = [['all','Todos'], ...Object.entries(CATS_MAP)];
  document.getElementById('prodCatFilter').innerHTML = btns.map(([id, label]) =>
    `<button class="filter-btn${prodCatFilter===id?' active':''}" onclick="setProdCat('${id}')">${label}</button>`
  ).join('');
}

function setProdCat(cat) { prodCatFilter = cat; renderProdCatFilter(); renderProdGrid(); }

function renderProdGrid() {
  const shown = prodCatFilter === 'all' ? allProducts : allProducts.filter(p => p.cat === prodCatFilter);
  const el    = document.getElementById('prodGrid');
  if (!shown.length) { el.innerHTML = '<p style="color:var(--muted);padding:20px">Nenhum produto nesta categoria.</p>'; return; }
  el.innerHTML = shown.map(p => `
    <div class="prod-card${p.avail?'':' unavailable'}">
      <div class="prod-img">${p.emoji||'🍽️'}</div>
      <div class="prod-info">
        <div class="prod-cat">${CATS_MAP[p.cat]||p.cat}</div>
        <div class="prod-name">${esc(p.name)}</div>
        <div class="prod-desc">${esc(p.desc||'')}</div>
        <div class="prod-price">R$ ${fmt(p.price||0)}</div>
        <div class="prod-foot">
          <button class="avail-toggle ${p.avail?'on':'off'}" onclick="toggleAvail('${p.docId}',${p.avail})">
            ${p.avail?'✓ Disponível':'✗ Indisponível'}
          </button>
          <div class="prod-acts">
            <button class="btn-icon" onclick="openProdModal('${p.docId}')" title="Editar">✏️</button>
            <button class="btn-icon" onclick="confirmDeleteProd('${p.docId}','${esc(p.name)}')" title="Excluir">🗑️</button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

async function toggleAvail(docId, currentAvail) {
  try {
    await db.collection('produtos').doc(docId).update({ avail: !currentAvail });
    toast(!currentAvail ? '✓ Produto disponível' : '✗ Produto indisponível');
    loadAndRenderProducts();
  } catch (e) { toast('Erro ao atualizar produto.'); }
}

function openProdModal(docId) {
  const p = docId ? allProducts.find(x => x.docId === docId) : null;
  document.getElementById('prodModalTitle').textContent = p ? 'Editar Produto' : 'Novo Produto';
  document.getElementById('prodDocId').value   = p ? p.docId : '';
  document.getElementById('prodName').value    = p ? p.name  : '';
  document.getElementById('prodCat').value     = p ? p.cat   : 'pizzas';
  document.getElementById('prodPrice').value   = p ? p.price : '';
  document.getElementById('prodDesc').value    = p ? (p.desc||'') : '';
  document.getElementById('prodEmoji').value   = p ? (p.emoji||'🍽️') : '🍽️';
  document.getElementById('prodAvail').checked = p ? p.avail : true;
  document.getElementById('prodModal').classList.add('show');
}

function closeProdModal() { document.getElementById('prodModal').classList.remove('show'); }

async function saveProd() {
  const docId = document.getElementById('prodDocId').value;
  const name  = document.getElementById('prodName').value.trim();
  const cat   = document.getElementById('prodCat').value;
  const price = parseFloat(document.getElementById('prodPrice').value);
  const desc  = document.getElementById('prodDesc').value.trim();
  const emoji = document.getElementById('prodEmoji').value.trim() || '🍽️';
  const avail = document.getElementById('prodAvail').checked;

  if (!name || !cat || isNaN(price) || price < 0) { toast('Preencha nome, categoria e preço válido!'); return; }

  try {
    if (docId) {
      await db.collection('produtos').doc(docId).update({ name, cat, price, desc, emoji, avail });
    } else {
      // New product: get max id and increment
      const snap  = await db.collection('produtos').orderBy('id', 'desc').limit(1).get();
      const maxId = snap.empty ? 0 : (snap.docs[0].data().id || 0);
      const newId = maxId + 1;
      await db.collection('produtos').doc(String(newId)).set({ id: newId, cat, name, desc, price, emoji, avail });
    }
    closeProdModal();
    await loadAndRenderProducts();
    toast(docId ? '✓ Produto atualizado!' : '✓ Produto adicionado!');
  } catch (e) { toast('Erro ao salvar produto.'); console.error(e); }
}

function confirmDeleteProd(docId, name) {
  showConfirm('🗑️', 'Excluir produto?', `"${name}" será removido do cardápio.`, async () => {
    await db.collection('produtos').doc(docId).delete();
    await loadAndRenderProducts();
    toast('Produto excluído.');
  });
}

/* =====================================================
   SETTINGS
   ===================================================== */
async function loadSettings() {
  try {
    const doc = await db.collection('config').doc('geral').get();
    const s   = doc.exists ? doc.data() : {};
    document.getElementById('setPix').value      = s.pix      || '(11) 99999-9999';
    document.getElementById('setFee').value      = s.fee      !== undefined ? s.fee : '5';
    document.getElementById('setAddr').value     = s.addr     || 'Rua das Pizzas, 123 — Centro';
    document.getElementById('setWhatsapp').value = s.whatsapp || '';
  } catch (e) { toast('Erro ao carregar configurações.'); }
}

async function saveSettings() {
  const pix  = document.getElementById('setPix').value.trim();
  const fee  = document.getElementById('setFee').value;
  const addr = document.getElementById('setAddr').value.trim();
  const np   = document.getElementById('setNewPwd').value;
  const cp   = document.getElementById('setConfPwd').value;

  if (np || cp) {
    if (np !== cp)       { toast('As senhas não coincidem!'); return; }
    if (np.length < 4)   { toast('Senha muito curta (mín. 4 caracteres)!'); return; }
    setPassword(np);
    document.getElementById('setNewPwd').value = '';
    document.getElementById('setConfPwd').value = '';
  }

  try {
    const whatsapp = document.getElementById('setWhatsapp').value.trim();
  await db.collection('config').doc('geral').set({ pix, fee: parseFloat(fee)||5, addr, whatsapp }, { merge: true });
    toast('✓ Configurações salvas!');
  } catch (e) { toast('Erro ao salvar configurações.'); }
}

/* =====================================================
   CONFIRM DIALOG
   ===================================================== */
function showConfirm(icon, title, msg, cb) {
  document.getElementById('confirmIcon').textContent  = icon;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent   = msg;
  document.getElementById('confirmOkBtn').onclick = () => { closeConfirm(); cb && cb(); };
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); }

/* =====================================================
   AUDIO NOTIFICATION
   ===================================================== */
function playBeep() {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; gain.gain.value = 0.25;
    osc.start(); setTimeout(() => { gain.gain.value = 0; osc.stop(); ctx.close(); }, 400);
  } catch (_) {}
}

/* =====================================================
   UTILITIES
   ===================================================== */
function fmt(n) { return Number(n||0).toFixed(2).replace('.', ','); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

/* =====================================================
   INIT
   ===================================================== */
function initApp() {
  showTab('orders');
  startOrdersListener();
}
</script>
